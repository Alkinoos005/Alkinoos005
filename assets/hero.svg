<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#170510"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="400" height="260" rx="14" fill="url(#bg2)"/>

  <!-- web strand hanging from top -->
  <line x1="330" y1="0" x2="270" y2="90" stroke="#8fa3ff" stroke-width="1.4" opacity="0.6"/>

  <!-- sitting figure silhouette on the strand -->
  <g transform="translate(230,90)">
    <!-- legs dangling -->
    <path d="M10,60 Q20,90 8,110" stroke="#0d0510" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M28,60 Q42,88 34,112" stroke="#0d0510" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- torso (hoodie) -->
    <path d="M0,10 Q20,-10 44,8 L46,62 Q20,74 -2,62 Z" fill="#1b3a93"/>
    <!-- hoodie stripe -->
    <path d="M4,14 Q20,0 40,12" stroke="#e62429" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- arms holding laptop -->
    <path d="M2,26 Q-18,34 -22,52" stroke="#1b3a93" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M42,26 Q62,34 66,52" stroke="#1b3a93" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- laptop -->
    <rect x="-6" y="48" width="60" height="6" rx="2" fill="#e9ecff"/>
    <rect x="-2" y="18" width="52" height="32" rx="3" fill="#0d0510" stroke="#8fa3ff" stroke-width="2"/>
    <rect x="4" y="24" width="40" height="4" fill="#39ff6a" opacity="0.8"/>
    <rect x="4" y="31" width="28" height="4" fill="#8fa3ff" opacity="0.8"/>
    <rect x="4" y="38" width="34" height="4" fill="#e62429" opacity="0.8"/>
    <!-- head, hood up -->
    <circle cx="22" cy="-6" r="16" fill="#12040a"/>
    <path d="M4,-6 Q22,-30 40,-6 Q34,-16 22,-16 Q10,-16 4,-6Z" fill="#1b3a93"/>
    <circle cx="16" cy="-6" r="3" fill="#8fa3ff"/>
    <circle cx="28" cy="-6" r="3" fill="#8fa3ff"/>
  </g>

  <!-- small web accents -->
  <g stroke="#8fa3ff" stroke-width="1" opacity="0.3">
    <line x1="0" y1="0" x2="120" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="100"/>
    <path d="M20,0 Q40,40 0,60" fill="none"/>
    <path d="M50,0 Q80,70 0,100" fill="none"/>
  </g>

  <text x="200" y="250" text-anchor="middle" fill="#8fa3ff" font-family="Consolas, Monaco, monospace" font-size="13">// friendly neighborhood dev, debugging at 2am</text>
</svg>
