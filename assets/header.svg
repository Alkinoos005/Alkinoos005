<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Monaco, 'Courier New', monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0512"/>
      <stop offset="55%" stop-color="#0d0310"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>
    <linearGradient id="skylineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#210a1c"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e62429" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e62429" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="900" height="340" rx="16" fill="url(#sky)" stroke="#1b3a93" stroke-width="1.5"/>

  <!-- moon / spidey signal -->
  <circle cx="790" cy="60" r="42" fill="url(#moonglow)"/>
  <circle cx="790" cy="60" r="16" fill="#e62429" opacity="0.85"/>

  <!-- stars / city lights -->
  <g fill="#8fa3ff" opacity="0.55">
    <circle cx="60" cy="30" r="1.4"/><circle cx="120" cy="55" r="1.2"/><circle cx="200" cy="20" r="1.6"/>
    <circle cx="300" cy="45" r="1.1"/><circle cx="420" cy="15" r="1.4"/><circle cx="520" cy="50" r="1.2"/>
    <circle cx="620" cy="25" r="1.5"/><circle cx="150" cy="90" r="1"/><circle cx="380" cy="80" r="1.3"/>
  </g>

  <!-- skyline silhouette along bottom -->
  <g fill="url(#skylineGrad)">
    <rect x="0" y="230" width="50" height="110"/>
    <rect x="55" y="200" width="35" height="140"/>
    <rect x="95" y="245" width="60" height="95"/>
    <rect x="160" y="215" width="30" height="125"/>
    <rect x="740" y="220" width="40" height="120"/>
    <rect x="785" y="250" width="55" height="90"/>
    <rect x="845" y="200" width="35" height="140"/>
  </g>
  <g stroke="#8fa3ff" stroke-width="1" opacity="0.5">
    <line x1="60" y1="200" x2="60" y2="230"/>
    <line x1="70" y1="215" x2="80" y2="215"/>
    <line x1="860" y1="200" x2="860" y2="225"/>
  </g>

  <!-- web strand + swinging figure — one rigid pendulum group, always attached -->
  <g transform="translate(820,0)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10 0 0;10 0 0;-10 0 0" dur="3.6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-260" y2="150" stroke="#8fa3ff" stroke-width="1.3" opacity="0.6"/>
      <g transform="translate(-260,150)">
        <circle cx="0" cy="0" r="7" fill="#e62429"/>
        <line x1="0" y1="7" x2="-6" y2="20" stroke="#e62429" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="7" x2="6" y2="20" stroke="#1b3a93" stroke-width="3" stroke-linecap="round"/>
        <line x1="-5" y1="10" x2="-16" y2="4" stroke="#e62429" stroke-width="3" stroke-linecap="round"/>
        <line x1="5" y1="10" x2="16" y2="4" stroke="#1b3a93" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="42" rx="16" fill="#0d0510"/>
  <rect x="0" y="28" width="900" height="14" fill="#0d0510"/>
  <circle cx="28" cy="21" r="7" fill="#e62429"/>
  <circle cx="50" cy="21" r="7" fill="#8fa3ff"/>
  <circle cx="72" cy="21" r="7" fill="#1b3a93"/>
  <text x="450" y="26" text-anchor="middle" fill="#9aa8d6" font-size="15">alkinoos@github:~$</text>

  <!-- body -->
  <rect x="20" y="60" width="440" height="256" rx="10" fill="#050208" opacity="0.55"/>
  <text x="34" y="90" fill="#e62429" font-size="17">$ whoami</text>
  <text x="34" y="116" fill="#f2f4ff" font-size="17">Alkinoos Polyzos <tspan fill="#6f7fc9">—</tspan> Full-Stack Dev</text>

  <text x="34" y="156" fill="#e62429" font-size="17">$ cat status.log</text>
  <text x="34" y="182" font-size="16"><tspan fill="#8fa3ff">[BOOT]</tspan><tspan fill="#e9ecff" dx="18">web-slinger mode: ON</tspan></text>
  <text x="34" y="206" font-size="16"><tspan fill="#8fa3ff">[BASE]</tspan><tspan fill="#e9ecff" dx="18">Greece</tspan></text>
  <text x="34" y="230" font-size="16"><tspan fill="#8fa3ff">[DEPT]</tspan><tspan fill="#e9ecff" dx="18">Electrical &amp; Computer Eng.</tspan></text>
  <text x="34" y="254" font-size="16"><tspan fill="#8fa3ff">[STATUS]</tspan><tspan fill="#e9ecff" dx="10">focusing</tspan></text>
  <text x="34" y="278" font-size="15"><tspan fill="#8fa3ff">[MOTTO]</tspan><tspan fill="#e9ecff" dx="14">with great commits comes</tspan></text>
  <text x="34" y="296" font-size="15"><tspan dx="86" fill="#e9ecff">great responsibility</tspan></text>
  <text x="34" y="322" font-size="15"><tspan fill="#e62429">[SENSE]</tspan><tspan fill="#e9ecff" dx="10">tingling — new visitor detected</tspan></text>

  <rect x="34" y="188" width="9" height="15" fill="#e62429">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
